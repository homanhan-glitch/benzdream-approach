<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>BenzDream 전국 재고·판매 흐름</title></head><body style="margin:0;background:#f3f6fa">
<div id="bd-sales-desk" aria-label="BenzDream 전국 재고·판매 흐름">
<style>
#bd-sales-desk [hidden]{display:none!important}
#bd-sales-desk{--bd-bg:#f3f6fa;--bd-paper:#fff;--bd-ink:#172b43;--bd-muted:#60738a;--bd-line:#e2e9f1;--bd-accent:#2463eb;--bd-tint:#edf3ff;--bd-green:#167568;background:var(--bd-bg);color:var(--bd-ink);font:14px/1.55 'Segoe UI','Malgun Gothic',sans-serif;border-radius:16px;overflow:hidden;color-scheme:light}
#bd-sales-desk *{box-sizing:border-box}#bd-sales-desk button,#bd-sales-desk input{font:inherit}#bd-sales-desk button{cursor:pointer}#bd-sales-desk .bd-top{background:var(--bd-paper);padding:18px 26px;border-bottom:1px solid var(--bd-line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}#bd-sales-desk .bd-brand{font-size:18px;font-weight:600;letter-spacing:-.5px}#bd-sales-desk .bd-brand span{color:var(--bd-accent)}#bd-sales-desk .bd-tag{color:var(--bd-muted);font-size:12px}#bd-sales-desk .bd-main{padding:26px}#bd-sales-desk .bd-title{display:flex;justify-content:space-between;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:20px}#bd-sales-desk h1{font-size:26px;letter-spacing:-1px;margin:0;font-weight:600}#bd-sales-desk h2{font-size:17px;margin:0;font-weight:600}#bd-sales-desk p{margin:4px 0;color:var(--bd-muted);font-size:12px}#bd-sales-desk .bd-date{border:1px solid var(--bd-line);padding:7px 12px;border-radius:8px;background:var(--bd-paper);font-size:12px}#bd-sales-desk .bd-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}#bd-sales-desk .bd-stat{background:var(--bd-paper);border:1px solid var(--bd-line);border-radius:12px;padding:16px}#bd-sales-desk .bd-stat:first-child{background:var(--bd-accent);color:#fff;border-color:transparent}#bd-sales-desk .bd-stat label{display:block;font-size:12px}#bd-sales-desk .bd-stat strong{font-size:30px;font-weight:600;letter-spacing:-1px;font-variant-numeric:tabular-nums;display:block;margin:8px 0}#bd-sales-desk .bd-stat small{font-size:12px;color:var(--bd-muted)}#bd-sales-desk .bd-stat:first-child small{color:#e4edff}#bd-sales-desk .bd-panel{background:var(--bd-paper);border:1px solid var(--bd-line);border-radius:12px;margin-bottom:18px;overflow:hidden}#bd-sales-desk .bd-panelhead{padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}#bd-sales-desk .bd-seg{display:flex;background:var(--bd-bg);border-radius:8px;padding:3px;gap:3px}#bd-sales-desk .bd-seg button{background:transparent;border:0;padding:6px 12px;border-radius:6px;color:var(--bd-muted);font-size:12px}#bd-sales-desk .bd-seg button[aria-pressed=true]{background:var(--bd-paper);color:var(--bd-accent);box-shadow:0 1px 4px #132b4412}#bd-sales-desk .bd-chart{display:flex;gap:12px;padding:4px 20px 18px;align-items:end;min-height:154px}#bd-sales-desk .bd-baritem{flex:1;min-width:0;text-align:center}#bd-sales-desk .bd-value{font-size:12px;font-variant-numeric:tabular-nums;margin-bottom:5px}#bd-sales-desk .bd-bar{background:var(--bd-accent);border-radius:5px 5px 0 0;max-width:48px;margin:auto;opacity:.65}#bd-sales-desk .bd-baritem:last-child .bd-bar{opacity:1}#bd-sales-desk .bd-label{font-size:11px;color:var(--bd-muted);margin-top:7px}#bd-sales-desk .bd-chartfoot{border-top:1px solid var(--bd-line);padding:10px 20px;display:flex;gap:20px;flex-wrap:wrap;font-size:12px;color:var(--bd-muted)}#bd-sales-desk .bd-chartfoot b{color:var(--bd-ink);font-weight:500}#bd-sales-desk .bd-controls{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px 16px}#bd-sales-desk .bd-controls input{border:1px solid var(--bd-line);background:var(--bd-bg);color:var(--bd-ink);border-radius:7px;padding:8px 12px;min-width:0;width:240px}#bd-sales-desk .bd-chip{border:1px solid var(--bd-line);background:var(--bd-paper);color:var(--bd-muted);border-radius:7px;padding:6px 12px;font-size:12px}#bd-sales-desk .bd-chip[aria-pressed=true]{border-color:var(--bd-accent);color:var(--bd-accent);background:var(--bd-tint)}#bd-sales-desk .bd-split{display:grid;grid-template-columns:1.3fr 1fr;border-top:1px solid var(--bd-line)}#bd-sales-desk .bd-list{padding:0 0 8px;min-width:0}#bd-sales-desk .bd-gridhead,#bd-sales-desk .bd-model{display:grid;grid-template-columns:minmax(0,1fr) 60px 65px;gap:8px;align-items:center}#bd-sales-desk .bd-gridhead{padding:10px 20px;font-size:11px;background:var(--bd-bg);color:var(--bd-muted)}#bd-sales-desk .bd-gridhead span:not(:first-child){text-align:right}#bd-sales-desk .bd-model{width:100%;border:0;border-bottom:1px solid var(--bd-line);padding:12px 20px;text-align:left;background:var(--bd-paper);color:var(--bd-ink)}#bd-sales-desk .bd-model[aria-pressed=true]{background:var(--bd-tint);box-shadow:inset 3px 0 var(--bd-accent)}#bd-sales-desk .bd-model small{display:block;font-size:11px;color:var(--bd-muted)}#bd-sales-desk .bd-model strong{font-weight:500;font-size:13px}#bd-sales-desk .bd-model .bd-n{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}#bd-sales-desk .bd-detail{border-left:1px solid var(--bd-line);background:var(--bd-paper);padding:18px;min-width:0}#bd-sales-desk .bd-detail h3{font-size:17px;margin:7px 0 4px;font-weight:600;letter-spacing:-.5px}#bd-sales-desk .bd-detailtop{color:var(--bd-accent);font-size:11px}#bd-sales-desk .bd-detailnums{display:flex;gap:20px;margin:15px 0 20px}#bd-sales-desk .bd-detailnums div{flex:1}#bd-sales-desk .bd-detailnums span{font-size:11px;display:block;color:var(--bd-muted)}#bd-sales-desk .bd-detailnums b{font-size:21px;font-weight:500}#bd-sales-desk .bd-combo{display:flex;gap:9px;align-items:center;padding:11px 0;border-bottom:1px solid var(--bd-line)}#bd-sales-desk .bd-dot{width:14px;height:14px;flex:none;border-radius:50%;border:1px solid #a5afbf}#bd-sales-desk .bd-combo .bd-cn{flex:1;min-width:0;font-size:12px;overflow-wrap:anywhere}#bd-sales-desk .bd-combo small{display:block;color:var(--bd-muted);font-size:11px}#bd-sales-desk .bd-combo b{font-size:15px;font-weight:500;white-space:nowrap}#bd-sales-desk .bd-more{display:block;border:0;background:transparent;color:var(--bd-accent);padding:12px 20px;font-size:12px}#bd-sales-desk .bd-footer{font-size:11px;color:var(--bd-muted);padding:0 2px}#bd-sales-desk .bd-empty{padding:24px;color:var(--bd-muted)}
@media(max-width:740px){#bd-sales-desk .bd-main{padding:16px}#bd-sales-desk .bd-kpis{grid-template-columns:repeat(2,1fr)}#bd-sales-desk .bd-split{grid-template-columns:1fr}#bd-sales-desk .bd-detail{border-left:0;border-top:1px solid var(--bd-line)}#bd-sales-desk .bd-chart{gap:5px}#bd-sales-desk .bd-seg button{padding:7px 9px}#bd-sales-desk h1{font-size:23px}}
</style>
<div class="bd-top"><div class="bd-brand">Benz<span>Dream</span> <span class="bd-tag">/ SALES DESK</span></div><div class="bd-tag">내부 영업용</div></div>
<main class="bd-main">
<div class="bd-title"><div><h1>재고를 보고, 다음 계약을 결정하다.</h1><p>전국 판매 흐름 · 차종 · 연식 · 색상별 재고</p></div><span class="bd-date">데이터 확인 중</span></div>
<div class="bd-kpis" id="bd-kpis"></div>
<section class="bd-panel"><div class="bd-panelhead"><div><h2>계약 흐름</h2><p id="bd-chartcaption">전국 계약·소진 추정 · 모터원 신규계약 + 타 파트너 소진</p></div><div class="bd-seg" id="bd-period"><button type="button" data-period="daily" aria-pressed="true">일간</button><button type="button" data-period="weekly" aria-pressed="false">주간</button><button type="button" data-period="monthly" aria-pressed="false">월간</button></div></div><div class="bd-chart" id="bd-chart" role="img" aria-label="기간별 전국 계약·소진 추정"></div><div class="bd-chartfoot" id="bd-flowfoot"></div></section>


<section class="bd-panel"><div class="bd-panelhead"><div><h2>차종·색상별 재고</h2><p>차종 선택으로 외장·내장 조합별 잔여 확인</p></div><span class="bd-tag" id="bd-count"></span></div><div class="bd-controls"><input aria-label="차종 검색" id="bd-search" placeholder="차종 검색 · E 300, GLE"><div id="bd-categories" style="display:flex;gap:6px;flex-wrap:wrap"></div></div><div class="bd-split"><div class="bd-list"><div class="bd-gridhead"><span>차종 / 트림</span><span>재고 대수</span><span id="bd-colperiod">최근일 소진</span></div><div id="bd-models"></div><button class="bd-more" type="button" id="bd-more">전체 차종 보기 ↓</button></div><aside class="bd-detail" id="bd-detail" aria-live="polite"></aside></div></section>
<div class="bd-footer">전국 소진은 모터원 신규계약과 타 파트너 VIN 이탈의 합계이며 확정 전국 계약 건수가 아닙니다. 일간은 파일 간 관측 구간이며 주·월 경계의 정확한 계약일은 확인되지 않을 수 있습니다.</div>
</main>

<script>
(async()=>{const root=document.getElementById('bd-sales-desk'),D=await loadData(); async function loadData(){const r=await fetch('contracts_web.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('데이터 응답 '+r.status);return r.json()}const $=id=>root.querySelector('#'+id),fmt=n=>Number(n||0).toLocaleString('ko-KR'),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let period='daily',cat='전체',query='',all=false,selected='E 300 4MATIC AMG Line';const dates=Object.keys(D.daily).sort(),last=dates.at(-1),cur=D.daily[last],wk=D.weekly.at(-1),mon=D.monthly.at(-1);const previous=D.daily[dates.at(-2)];const delta=previous?cur.sell-previous.sell:0;root.querySelector('.bd-date').textContent='데이터 기준 '+last;const periodText=p=>p.start+' ~ '+p.end;
$('bd-kpis').innerHTML=[['전국 판매가능 재고',D.sellable_now+'',`전일 대비 ${delta>0?'+':''}${fmt(delta)}대`],['최근일 전국 소진 추정',cur.mo_new+cur.nat_other,last+' · 전국 추정'],['최근 주 전국 소진 추정',wk.mo_new+wk.nat_other,periodText(wk)+' · 전국 추정'],['최근 월 전국 소진 추정',mon.mo_new+mon.nat_other,periodText(mon)+' · 전국 추정']].map(([k,v,s],i)=>`<div class="bd-stat"><label>${k}</label><strong>${fmt(v)}<span style="font-size:13px;margin-left:5px;letter-spacing:0">대</span></strong><small>${s}</small></div>`).join('');
function periodDates(){return period==='daily'?[last]:period==='weekly'?wk.days:mon.days}function count(r){const h=D.heat[r.cat+'|'+r.model]||{};return periodDates().reduce((s,d)=>s+(h[d]?.[0]||0)+(h[d]?.[1]||0),0)}
function chart(){let a=period==='daily'?dates.slice(-9).map(d=>({label:d.slice(5).replace('-','/'),...D.daily[d]})):D[period].slice(-8).map(p=>({...p,label:period==='weekly'?p.start.slice(5).replace('-','/')+'~':p.start.slice(0,7)}));const max=Math.max(1,...a.map(x=>x.mo_new+x.nat_other));$('bd-chart').innerHTML=a.map(x=>`<div class="bd-baritem"><div class="bd-value">${fmt(x.mo_new+x.nat_other)}</div><div class="bd-bar" style="height:${Math.max(2,88*(x.mo_new+x.nat_other)/max)}px"></div><div class="bd-label">${x.label}</div></div>`).join('');const p=period==='daily'?cur:period==='weekly'?wk:mon;$('bd-flowfoot').innerHTML=`<span>모터원 신규계약 <b>${fmt(p.mo_new)}건</b></span><span>타 파트너 소진 <b>${fmt(p.nat_other)}대</b></span><span>전국 합계 추정 <b>${fmt(p.mo_new+p.nat_other)}대</b></span>`;$('bd-colperiod').textContent=period==='daily'?'최근일 소진':period==='weekly'?'최근 주 소진':'최근 월 소진'}
function yearGroups(r){return D.year_stock?.[r.cat+'|'+r.model]||{}}
function yearLabel(r){const ys=Object.keys(yearGroups(r)).filter(y=>y!=='unknown');return ys.length>1?' · '+ys.sort().map(y=>esc(y)+'년식').join(' / '):''}
function yearDetail(r){const groups=yearGroups(r),ys=Object.keys(groups);if(ys.filter(y=>y!=='unknown').length<2)return '';return ys.sort().map(y=>`<details open style="margin-top:12px"><summary style="cursor:pointer;color:var(--bd-accent);font-size:12px">${y==='unknown'?'연식 미확인':esc(y)+'년식'} · ${fmt(groups[y].stock)}대</summary>${Object.entries(groups[y].combos).sort((a,b)=>b[1]-a[1]).map(([c,n])=>`<div class="bd-combo"><div class="bd-cn">${esc(c.split('|')[0])}<small>${esc(c.split('|')[1]||'미기재')}</small></div><b>${fmt(n)}대</b></div>`).join('')}</details>`).join('')}
function detail(){const r=D.rows.find(x=>x.model===selected);if(!r)return;const combos=Object.entries(r.combos).sort((a,b)=>b[1]-a[1]);const col=s=>/화이트/.test(s)?'#f5f6f8':/블랙/.test(s)?'#202630':/그레이/.test(s)?'#89929f':/실버/.test(s)?'#b5c0cd':/블루/.test(s)?'#355779':/레드/.test(s)?'#9d414d':'#b6a38a';$('bd-detail').innerHTML=`<div class="bd-detailtop">선택한 차종 · ${esc(r.cat)}${yearLabel(r)}</div><h3>${esc(r.model)}</h3><div class="bd-detailnums"><div><span>판매가능 재고</span><b>${fmt(r.stock)}<small style="font-size:12px"> 대</small></b></div><div><span>${$('bd-colperiod').textContent} · 전국 추정</span><b>${count(r)}<small style="font-size:12px"> 대</small></b></div><div><span>색상 조합</span><b>${combos.length}<small style="font-size:12px"> 종</small></b></div></div><div class="bd-tag">외장 / 내장별 재고</div>${yearDetail(r)||combos.map(([s,n])=>{const [e,i]=s.split('|');return `<div class="bd-combo"><span class="bd-dot" style="background:${col(e)}"></span><div class="bd-cn">${esc(e)}<small>${esc(i||'미기재')}</small></div><b>${fmt(n)}대</b></div>`}).join('')||'<p>판매가능 색상 재고 없음</p>'}`}
function list(){const rows=D.rows.filter(r=>r.stock>0&&(cat==='전체'||r.cat===cat)&&(!query||(r.model+' '+r.cat).toLowerCase().includes(query))).sort((a,b)=>b.stock-a.stock);$('bd-count').textContent=`${rows.length}개 트림 · ${fmt(rows.reduce((s,r)=>s+r.stock,0))}대`;if(rows.length&&!rows.some(r=>r.model===selected))selected=rows[0].model;$('bd-models').innerHTML=(all?rows:rows.slice(0,7)).map(r=>`<button class="bd-model" type="button" data-model="${esc(r.model)}" aria-pressed="${selected===r.model}"><span><small>${esc(r.cat)}${yearLabel(r)}</small><strong>${esc(r.model)}</strong></span><span class="bd-n">${fmt(r.stock)}</span><span class="bd-n">${count(r)}</span></button>`).join('')||'<div class="bd-empty">일치하는 차종이 없습니다.</div>';$('bd-more').hidden=rows.length<=7;$('bd-more').textContent=all?'접기 ↑':`전체 ${rows.length}개 트림 보기 ↓`;if(rows.length)detail();else $('bd-detail').innerHTML='';}
function categories(){const cs=['전체','E클래스','GLC','GLE','S클래스'];$('bd-categories').innerHTML=cs.map(c=>`<button class="bd-chip" data-cat="${c}" type="button" aria-pressed="${c===cat}">${c}</button>`).join('')}
$('bd-period').onclick=e=>{const b=e.target.closest('[data-period]');if(!b)return;period=b.dataset.period;$('bd-period').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));chart();list()};$('bd-categories').onclick=e=>{const b=e.target.closest('[data-cat]');if(!b)return;cat=b.dataset.cat;categories();list()};$('bd-search').oninput=e=>{query=e.target.value.trim().toLowerCase();list()};$('bd-models').onclick=e=>{const b=e.target.closest('[data-model]');if(!b)return;selected=b.dataset.model;list()};$('bd-more').onclick=()=>{all=!all;list()};chart();categories();list();

})().catch(error=>{const root=document.getElementById('bd-sales-desk');const msg=document.createElement('p');msg.setAttribute('role','alert');msg.textContent='데이터를 불러오지 못했습니다. 잠시 후 새로고침해 주세요. '+error.message;root.querySelector('.bd-main').prepend(msg);root.querySelector('.bd-date').textContent='데이터 확인 실패';});
</script>
</div>

</body></html>
